[project]
name = "semantic-search"
version = "0.1.0"
description = "Keyword search vs. semantic (embedding) search on a product catalog"
readme = "README.md"
authors = [{ name = "Leila Alizadeh" }]
requires-python = ">=3.10"
dependencies = [
    "faiss-cpu>=1.15.1",
    "fastapi>=0.162.0",
    "huggingface-hub>=0.24",
    "numpy>=1.26",
    "pyarrow>=17.0",
    "sentence-transformers>=3.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
semantic-search = "semantic_search.levels.level5.cli:main"
prepare-data = "semantic_search.levels.level5.prepare_data:main"
benchmark = "semantic_search.levels.level5.benchmark:main"
web = "semantic_search.web:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
